<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="A calm, minimalist task list that shows one day at a time. Private by design: your tasks never leave your device."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <title>One Day</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="home">
      <div id="app" class="pre">
        <header>
          <h1 class="sr-only">One Day</h1>
          <div class="rule" aria-hidden="true"><i></i></div>
          <div class="bar">
            <button
              class="ib"
              id="prev"
              type="button"
              data-tip="Previous day"
              data-key="←"
              aria-label="Previous day"
            >
              <svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
            </button>
            <button class="ib" id="next" type="button" data-tip="Next day" data-key="→" aria-label="Next day">
              <svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
            </button>
            <button class="todayb" id="todayb" type="button" data-tip="Back to today" data-key="D">
              Today
            </button>
            <span class="sp"></span>
            <button class="ib" id="sb" type="button" data-tip="Search" data-key="/" aria-label="Search">
              <svg viewBox="0 0 20 20">
                <circle cx="9" cy="9" r="5.5" />
                <path d="m13.2 13.2 3.8 3.8" />
              </svg>
            </button>
            <button
              class="ib tmb"
              id="tmb"
              type="button"
              data-tip="Timer"
              data-key="T"
              aria-label="Timer"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="tpop"
            >
              <svg class="tic" viewBox="0 0 20 20">
                <circle cx="10" cy="11" r="6.25" />
                <path d="M10 8v3.2l2 1.4M8.2 2.5h3.6" />
              </svg>
              <span class="tpl"
                ><svg class="tmr" viewBox="0 0 16 16">
                  <circle class="bg" cx="8" cy="8" r="6" />
                  <circle class="fg" cx="8" cy="8" r="6" /></svg
                ><span class="tv" id="tv"></span
              ></span>
            </button>
            <button
              class="ib"
              id="float"
              type="button"
              data-tip="Keep on top"
              data-key="P"
              aria-label="Keep on top of other windows"
              aria-pressed="false"
            >
              <svg viewBox="0 0 20 20">
                <rect x="2.5" y="4" width="15" height="12" rx="2.5" />
                <rect x="10" y="9" width="5" height="4.5" rx="1" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
          <div class="date">
            <div class="num" id="num" aria-hidden="true"></div>
            <button
              class="meta"
              id="meta"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="pop"
            >
              <span class="sr-only" id="dnum"></span>
              <span class="wd" id="wd"></span>
              <span class="mo"
                ><span id="mo"></span><svg viewBox="0 0 14 14"><path d="m3.5 5.5 3.5 3.5 3.5-3.5" /></svg
              ></span>
              <span class="rel" id="rel"></span>
              <span class="sr-only">, choose another day</span>
            </button>
          </div>
          <div class="pop" id="pop" role="dialog" aria-label="Choose a day">
            <div class="ph">
              <span id="popT"></span>
              <div>
                <button
                  class="ib"
                  id="pmPrev"
                  type="button"
                  data-tip="Previous month"
                  aria-label="Previous month"
                >
                  <svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
                </button>
                <button class="ib" id="pmNext" type="button" data-tip="Next month" aria-label="Next month">
                  <svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
                </button>
              </div>
            </div>
            <div class="grid" id="grid"></div>
          </div>
          <div class="pop tpop" id="tpop" role="dialog" aria-label="Timer">
            <div class="ph">
              <span>Timer</span>
              <div class="seg" id="seg" role="radiogroup" aria-label="Display">
                <button type="button" role="radio" data-m="calm">Calm</button
                ><button type="button" role="radio" data-m="live">Live</button><i></i>
              </div>
            </div>
            <div id="tset">
              <div class="tpick">
                <button class="ib" id="tminus" type="button" aria-label="Less time">
                  <svg viewBox="0 0 20 20"><path d="M5 10h10" /></svg>
                </button>
                <div class="tbig" id="tpv" aria-live="polite"></div>
                <span class="tunit">min</span
                ><button class="ib" id="tplus" type="button" aria-label="More time">
                  <svg viewBox="0 0 20 20"><path d="M10 5v10M5 10h10" /></svg>
                </button>
              </div>
              <div class="chips" id="tpre">
                <button class="chip" type="button" data-v="5">5</button
                ><button class="chip" type="button" data-v="15">15</button
                ><button class="chip" type="button" data-v="25">25</button
                ><button class="chip" type="button" data-v="45">45</button>
              </div>
              <button class="cta" id="tstart" type="button">Start</button>
            </div>
            <div id="trun" hidden>
              <div class="tdisp">
                <div class="tbig" id="tbig"></div>
                <span class="tunit l-calm" id="tunit">min left</span>
              </div>
              <div class="tline l-calm"><i id="tsec"></i></div>
              <div class="tline l-live"><i id="tprog"></i></div>
              <div class="tacts">
                <button type="button" id="tpause">Pause</button><button type="button" id="tadd">+1 min</button
                ><button type="button" id="tstop">Stop</button>
              </div>
            </div>
          </div>
        </header>
        <main class="vp" id="vp">
          <div class="sc" id="sc">
            <div class="stage" id="stage">
              <div class="carry" id="carry" hidden>
                <span id="carryTxt"></span><button id="bring" type="button">Bring here</button>
              </div>
              <ul id="list" aria-label="Tasks"></ul>
              <p class="empty" id="empty" hidden></p>
            </div>
            <div class="add" id="add">
              <span class="plus" aria-hidden="true"
                ><svg viewBox="0 0 18 18"><path d="M9 3.5v11M3.5 9h11" /></svg
              ></span>
              <input
                id="input"
                type="text"
                placeholder="Add a task"
                aria-label="Add a task"
                aria-describedby="dlabel"
                enterkeyhint="done"
                maxlength="500"
                autocomplete="off"
              />
              <kbd class="kbd" aria-hidden="true">Enter</kbd>
              <button
                class="dchip"
                id="dchip"
                type="button"
                data-tip="Choose the day"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="dpop"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="2.25" y="3" width="11.5" height="10.75" rx="2.75" />
                  <path d="M2.5 6.6h11M5.4 1.6v2.8M10.6 1.6v2.8" />
                </svg>
                <span id="dlabel">Today</span>
              </button>
            </div>
          </div>
        </main>
        <div class="dpop" id="dpop" role="dialog" aria-label="Add the task to">
          <div class="dq" id="dq">
            <button type="button" class="chip" data-d="today">Today</button
            ><button type="button" class="chip" data-d="tomorrow">Tomorrow</button
            ><button type="button" class="chip" data-d="week">Next week</button>
          </div>
          <div class="ph">
            <span id="dpT"></span>
            <div>
              <button class="ib" id="dpPrev" type="button" data-tip="Previous month" aria-label="Previous month">
                <svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
              </button>
              <button class="ib" id="dpNext" type="button" data-tip="Next month" aria-label="Next month">
                <svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
              </button>
            </div>
          </div>
          <div class="grid" id="dgrid"></div>
        </div>
        <div class="srch" id="srch" role="dialog" aria-label="Search" inert>
          <div class="sbar">
            <svg viewBox="0 0 20 20">
              <circle cx="9" cy="9" r="5.5" />
              <path d="m13.2 13.2 3.8 3.8" /></svg
            ><input
              id="sq"
              type="text"
              placeholder="Search tasks and #tags"
              aria-label="Search tasks"
              autocomplete="off"
              enterkeyhint="go"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="slist"
              aria-expanded="false"
            /><button
              class="ib"
              id="sx"
              type="button"
              data-tip="Close"
              data-key="Esc"
              aria-label="Close search"
            >
              <svg viewBox="0 0 20 20"><path d="m5.5 5.5 9 9m0-9-9 9" /></svg></button
            ><i></i>
          </div>
          <div class="sres" id="sres">
            <div class="hl" id="hl"></div>
            <div id="slist" role="listbox" aria-label="Results"></div>
            <span class="sr-only" id="scount" role="status" aria-live="polite"></span
            ><input type="file" id="impf" accept="application/json,.json" hidden />
          </div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite">
          <span id="toastTxt"></span><button id="undo" type="button">Undo</button>
        </div>
        <div class="tip" id="tip" role="tooltip"></div>
        <div class="fmt" id="fmt" role="toolbar" aria-label="Text format">
          <button type="button" data-c="bold" data-tip="Bold" data-key="⌘B" aria-label="Bold">
            <b>B</b>
          </button>
          <button type="button" data-c="italic" data-tip="Italic" data-key="⌘I" aria-label="Italic">
            <i class="it">I</i>
          </button>
          <button
            type="button"
            data-c="strikeThrough"
            data-tip="Strikethrough"
            data-key="⌘⇧S"
            aria-label="Strikethrough"
          >
            <s>S</s>
          </button>
          <button type="button" data-c="code" data-tip="Code" data-key="⌘E" aria-label="Code">
            <svg viewBox="0 0 20 20"><path d="M7 6 3 10l4 4M13 6l4 4-4 4" /></svg>
          </button>
          <span class="sep"></span>
          <button
            type="button"
            data-c="insertUnorderedList"
            data-tip="List"
            data-key="- space"
            aria-label="Bulleted list"
          >
            <svg viewBox="0 0 20 20">
              <path d="M8 6h9M8 10h9M8 14h9" />
              <circle cx="4" cy="6" r=".6" />
              <circle cx="4" cy="10" r=".6" />
              <circle cx="4" cy="14" r=".6" />
            </svg>
          </button>
          <button type="button" data-c="link" data-tip="Link" data-key="⌘K" aria-label="Link">
            <svg viewBox="0 0 20 20">
              <path
                d="M8.6 11.4a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9M11.4 8.6a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l.9-.9"
              />
            </svg>
          </button>
          <input id="fmtIn" type="url" placeholder="Paste a link, then Enter" aria-label="Link address" />
        </div>
        <div class="lb" id="lb">
          <a id="lbA" target="_blank" rel="noopener noreferrer"></a
          ><button id="lbRm" type="button">Remove</button>
        </div>
        <div class="sug" id="sug" role="listbox" aria-label="Tags"></div>
      </div>
      <footer class="foot" id="foot">
        <a class="promo" href="https://dogood.day/" target="_blank" rel="noopener" referrerpolicy="strict-origin"
          >Start journaling with <b>dogood.day</b></a
        >
        <nav aria-label="About One Day">
          <a href="https://bemorin.com/privacy#one-day" target="_blank" rel="noopener">Privacy</a>
          <a href="https://bemorin.com/legal" target="_blank" rel="noopener">Legal notice</a>
          <a
            class="ico"
            href="https://github.com/bemorin/one-day"
            target="_blank"
            rel="noopener"
            data-tip="Source code on GitHub"
            aria-label="Source code on GitHub"
            ><svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
              /></svg
          ></a>
          <a
            class="ico"
            href="https://x.com/benmorinbm"
            target="_blank"
            rel="noopener"
            data-tip="@benmorinbm on X"
            aria-label="@benmorinbm on X"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23zm-1.16 17.52h1.83L7.08 4.13H5.12z"
              /></svg
          ></a>
        </nav>
      </footer>
    </div>
    <div class="fl">
      <div>
        <p>One Day is floating on top of your windows.</p>
        <button id="back" type="button">Bring it back</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
