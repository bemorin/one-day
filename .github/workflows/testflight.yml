name: TestFlight

# One Day for iPhone and iPad, signed and sent to TestFlight (App Store Connect), from GitHub's Macs. It runs when a tag
# testflight-<n> is pushed (the commit it names is the one sent), or by hand (Actions → TestFlight → Run workflow) once
# this file is on the default branch, where GitHub looks for it. It needs these secrets, all from the Apple Developer
# account:
#   APPLE_TEAM_ID   the Team ID
#   ASC_KEY_ID      an App Store Connect API key's ID (a Team key with the Admin role: fastlane makes the signing
#                   certificate and profile with it)
#   ASC_ISSUER_ID   the Issuer ID shown above the keys
#   ASC_KEY         the key's file (AuthKey_….p8), its whole text
# The build number is the run's number, so each upload is a new build. Nothing here is published: TestFlight builds
# reach only the testers chosen in App Store Connect.
on:
  push:
    tags: ['testflight-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Sign and send to TestFlight (iPhone and iPad)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: The key, from the secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::The repository has no secret for $v (see the top of testflight.yml)"; exit 1; fi
          done
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          # The key as the .p8 file holds it, however it was pasted (Windows line ends, lines run together, spaces):
          # its base64 body, wrapped at 64 characters between its BEGIN and END lines.
          python3 - > "$KEY" <<'PY'
          import os, re, textwrap
          body = re.sub(r'-----(BEGIN|END) [A-Z ]*PRIVATE KEY-----', '', os.environ['ASC_KEY'])
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          print('-----BEGIN PRIVATE KEY-----')
          print('\n'.join(textwrap.wrap(body, 64)))
          print('-----END PRIVATE KEY-----')
          PY
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY doesn't hold an App Store Connect key: paste the whole AuthKey_….p8 file, its BEGIN and END lines included"
            exit 1
          fi
      - name: Tools
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Project
        working-directory: apple
        run: xcodegen generate
      # The build is signed for the App Store with a certificate made for this run and revoked at its end, and an App
      # Store profile, which needs no registered device: see apple/fastlane/Fastfile.
      - name: Sign and send to TestFlight
        working-directory: apple
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_DISABLE_COLORS: '1'
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          fastlane beta
          mkdir -p build/logs && cp -R ~/Library/Logs/gym/. build/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-${{ github.run_number }}
          path: |
            apple/build/logs/
            apple/build/entitlements.txt
            ~/Library/Logs/gym/
          retention-days: 14
