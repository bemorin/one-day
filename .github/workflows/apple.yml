name: Apple app

# One Day for iPhone, iPad and Mac (apple/): built and tested on GitHub's Macs, free for a public repository.
# Nothing is signed or sent to Apple here.
on:
  push:
    branches: [main, apple-app]
    paths: ['apple/**', 'public/**', 'tests/apple-bridge.spec.mjs', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**', 'public/**', 'tests/apple-bridge.spec.mjs', '.github/workflows/apple.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: The app's bridge, in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/apple-bridge.spec.mjs

  # Two kinds of Mac at once: GitHub sometimes has no free Mac of one kind for a while. Each takes the newest Xcode 26 it
  # carries (Xcode 26 or later is what the App Store asks for since April 2026).
  build:
    name: Build and test on ${{ matrix.os }} (iPhone simulator, Mac)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Project
        working-directory: apple
        run: xcodegen generate
      - name: iPhone (simulator)
        working-directory: apple
        run: |
          set -o pipefail
          mkdir -p build
          SIM=$(sh ci/iphone.sh)
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcodebuild test -project OneDay.xcodeproj -scheme OneDay-iOS -destination "id=$SIM" \
            -derivedDataPath build/dd -resultBundlePath build/ios.xcresult -quiet CODE_SIGNING_ALLOWED=NO ONEDAY_ICLOUD=NO 2>&1 | tee build/ios.log
      - name: Mac
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test -project OneDay.xcodeproj -scheme OneDay-macOS -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/dd -resultBundlePath build/mac.xcresult -quiet CODE_SIGNING_ALLOWED=NO ONEDAY_ICLOUD=NO 2>&1 | tee build/mac.log
      - name: Pictures (iPhone, light and dark)
        # the tests above decide whether the build is good; a picture that fails doesn't
        continue-on-error: true
        working-directory: apple
        run: |
          APP="build/dd/Build/Products/Debug-iphonesimulator/One Day.app"
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$APP"
          mkdir -p build/shots
          for look in light dark; do
            xcrun simctl ui "$SIM" appearance "$look"
            xcrun simctl launch --terminate-running-process "$SIM" com.bemorin.oneday
            sleep 10
            xcrun simctl io "$SIM" screenshot "build/shots/iphone-$look.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-${{ github.run_number }}-${{ matrix.os }}
          path: |
            apple/build/shots/
            apple/build/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-results-${{ github.run_number }}-${{ matrix.os }}
          path: apple/build/*.xcresult
          retention-days: 7
